plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
    id 'jacoco'
}

loom {
    accessWidenerPath = file("src/main/resources/baritone-api-bridge.accesswidener")
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // HTTP client used by the bridge (Webb)
    // The real dependency is normally fetched from Maven Central, but some
    // environments (offline or restricted) cannot resolve it during CI/local
    // builds. A small local stub is provided under
    // src/main/java/com/goebl/david/Webb.java to allow compilation. If you
    // prefer the real client, replace the stub by adding the dependency and
    // allowing Gradle to fetch from Maven Central.
    // implementation 'com.goebl:david-webb:0.9'

    // Local Baritone API
    // We expect the user to put baritone-api-fabric-*.jar in the 'libs' folder
    modImplementation files('libs/baritone-api-fabric-1.15.0.jar')

    // WebSocket and networking
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    implementation 'org.lz4:lz4-java:1.8.0'

    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testImplementation files('libs/baritone-api-fabric-1.15.0.jar')
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
