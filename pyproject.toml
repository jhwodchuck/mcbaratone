[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baritone-client"
version = "0.1.0"
description = "Python facade and optional HTTP client for controlling Baritone"
authors = [{name = "mcbaratone contributors"}]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "py4j>=0.10.9.9",
    "websockets>=12.0",
    "pydantic>=2.7",
    "mcp>=1.25.0",
    "lz4>=4.3.0",
    "requests>=2.31",
    "typing-extensions>=4.12.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/jhwodchuck/mcbaratone"
Repository = "https://github.com/jhwodchuck/mcbaratone"

[project.scripts]
baritone-mcp-server = "baritone_client.mcp_server:main"
baritone-http-client = "baritone_client.http_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"baritone_client.http_api" = ["data/*.html", "data/*.json"]
